name: Release Firmware

on:
  workflow_dispatch:

jobs:
  build-175c:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Waveshare 1.75c Firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cat << 'EOF' >> sdkconfig.defaults.esp32s3
          CONFIG_LANGUAGE_ZH_TW=y
          CONFIG_USE_AUDIO_PROCESSOR=y
          CONFIG_USE_WAKE_WORD_DETECTION=y
          CONFIG_SR_MN_CN_MULTINET7_QUANT=y
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          CONFIG_CUSTOM_WAKE_WORD="ni hao tong tong"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="你好彤彤"
          CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=15
          EOF
          python3 scripts/build.py waveshare/esp32-s3-touch-amoled-1.75 --name esp32-s3-touch-amoled-1.75c --language zh-TW

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-1.75c-firmware
          path: |
            releases/*.zip
            build/merged-binary.bin
